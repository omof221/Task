version: "3.9"

services:
  # ─── Altyapı Servisleri ───────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ms_mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-YourStrong!Passw0rd}' -Q 'SELECT 1' -No -C"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - microservices_net

  redis:
    image: redis:7-alpine
    container_name: ms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ms_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - microservices_net

  seq:
    image: datalust/seq:latest
    container_name: ms_seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
      # Seq 2024+ zorunlu: ya şifre ver ya da auth'u kapat
      # Geliştirme ortamı için auth kapalı (production'da şifre koy)
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5342:80"       # UI Portu
      - "5341:5341"     # Log Alım Portu
    volumes:
      - seq_data:/data
    networks:
      - microservices_net

  # ─── Uygulama Servisleri ──────────────────────────────────────────
  auth-service:
    build:
      context: ..
      dockerfile: src/AuthService/AuthService.API/Dockerfile
    container_name: ms_auth
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=AuthDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__Secret: ${JWT_SECRET:-SuperSecretKeyForJwtTokenGeneration2024!}
      Jwt__Issuer: ${JWT_ISSUER:-MicroserviceAuth}
      Jwt__Audience: ${JWT_AUDIENCE:-MicroserviceClients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5001:8080"
    depends_on:
      mssql:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - microservices_net

  product-service:
    build:
      context: ..
      dockerfile: src/ProductService/ProductService.API/Dockerfile
    container_name: ms_product
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=ProductDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Redis__ConnectionString: redis:6379
      RabbitMq__ConnectionString: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      Jwt__Secret: ${JWT_SECRET:-SuperSecretKeyForJwtTokenGeneration2024!}
      Jwt__Issuer: ${JWT_ISSUER:-MicroserviceAuth}
      Jwt__Audience: ${JWT_AUDIENCE:-MicroserviceClients}
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5002:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices_net

  log-service:
    build:
      context: ..
      dockerfile: src/LogService/LogService.API/Dockerfile
    container_name: ms_log
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__ConnectionString: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      Seq__ServerUrl: http://seq:5341
      Elasticsearch__Uri: ${ELASTICSEARCH_URI:-http://elasticsearch:9200}
    ports:
      - "5003:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - microservices_net

  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/Dockerfile
    container_name: ms_gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: ${JWT_SECRET:-SuperSecretKeyForJwtTokenGeneration2024!}
      Jwt__Issuer: ${JWT_ISSUER:-MicroserviceAuth}
      Jwt__Audience: ${JWT_AUDIENCE:-MicroserviceClients}
    ports:
      - "5000:8080"
    depends_on:
      - auth-service
      - product-service
      - log-service
    networks:
      - microservices_net

  nginx:
    image: nginx:alpine
    container_name: ms_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - microservices_net

volumes:
  mssql_data:
  redis_data:
  rabbitmq_data:
  seq_data:

networks:
  microservices_net:
    driver: bridge